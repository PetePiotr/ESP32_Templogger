; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; "pio run" und der Upload-Knopf nur für das Board. env:native hat kein main()
; und wird ausschließlich über "pio test -e native" gebaut.
default_envs = waveshare_p4_poe_eth

[env:waveshare_p4_poe_eth]
; pioarduino = Arduino-ESP32 Core 3.x (benötigt für ESP32-P4 und Network.h)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

; Verbautes Board: ESP32-P4 Chip-Revision v3.2 (400 MHz, per esptool flash-id gelesen).
; Für Chips vor Rev. 3.00 (360 MHz) stattdessen "esp32-p4" verwenden.
board = esp32-p4_r3
; Pin-Definitionen des Waveshare ESP32-P4-WIFI6-POE-ETH (Ethernet-PHY, UART, ...)
board_build.variant = waveshare_p4_poe_eth
board_build.flash_mode = dio
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = default_32MB.csv

monitor_speed = 115200

lib_deps =
    pstolarz/OneWireNg
    milesburton/DallasTemperature
    bblanchon/ArduinoJson@^7
    https://github.com/eModbus/eModbus.git

; DallasTemperature zieht automatisch Paul Stoffregens "OneWire" nach, das auf
; dem ESP32-P4 nicht kompiliert. OneWireNg liefert eine kompatible OneWire.h.
lib_ignore =
    OneWire

; Tests laufen nur auf dem PC (env:native), nicht auf dem Board.
test_ignore = *

; =============================================================================
;  Host-Tests: PlatformIO -> native -> Test   (oder: pio test -e native)
;  Die echten Klassen aus src/ laufen gegen simulierte Hardware (test/sim/HostSim):
;  DS18B20 am 1-Wire-Bus, Modbus-Gateway, Ethernet/NTP, HTTP, Task-Watchdog.
;  Echt (nicht simuliert) sind außerdem DallasTemperature und ArduinoJson.
;  Voraussetzung: g++ (MinGW) – siehe scripts/host_toolchain.py
; =============================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = yes
; zusätzlich die Fachlogik der ESPHome-Variante (test_esphome_core)
build_src_filter = +<*> -<main.cpp> +<../esphome/components/daq_push/daq_core.cpp>
build_flags =
    -std=gnu++17
    -I esphome/components/daq_push
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DUNITY_INCLUDE_DOUBLE
extra_scripts = pre:scripts/host_toolchain.py
lib_extra_dirs = test/sim
lib_compat_mode = off
lib_deps =
    milesburton/DallasTemperature@^4.0.6
    bblanchon/ArduinoJson@^7.4.2
; die simulierte OneWire.h kommt aus HostSim
lib_ignore =
    OneWire
